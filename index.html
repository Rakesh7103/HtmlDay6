<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>
</head>
<body>

    <h2>Course Registration Form</h2>

    <form>
        <fieldset>
            <legend>Personal Details</legend>

            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" name="first_name" required>
            <br><br>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>
            <br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm_password" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <span>Gender:</span>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Others</label>
            <br><br>

            <label for="country">Select Country:</label>
            <select id="country" name="country">
                <option value="">--Select Country--</option>
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="canada">Canada</option>
                <option value="australia">Australia</option>
            </select>
            <br><br>

            <label for="picture">Upload Picture:</label>
            <input type="file" id="picture" name="picture" accept="image/*">
            <br><br>

            <input type="reset" value="Reset">
        </fieldset>

        <br>

        <fieldset>
            <legend>Course Details</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="">--Select Course--</option>
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="html-css">HTML &amp; CSS</option>
            </select>
            <br><br>

            <span>Delivery Mode:</span>
            <input type="radio" id="online" name="delivery_mode" value="online">
            <label for="online">Online</label>

            <input type="radio" id="offline" name="delivery_mode" value="offline">
            <label for="offline">Offline</label>
            <br><br>

            <label for="comments">Comments:</label>
            <br>
            <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
            <br><br>

            <input type="submit" value="Submit">
        </fieldset>
    </form>

</body>
</html>
